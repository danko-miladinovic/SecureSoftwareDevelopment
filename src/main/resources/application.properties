spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.initialization-mode=always
server.servlet.session.cookie.http-only=false
server.error.whitelabel.enabled=false
spring.data.mongodb.database=carstore
spring.mongodb.embedded.version=4.0.21
# MongoDB 4.0 Windows archives use the 2008plus-ssl filename. Custom
# versions need explicit features because Flapdoodle cannot infer them.
spring.mongodb.embedded.features=SYNC_DELAY,NO_HTTP_INTERFACE_ARG,ONLY_WINDOWS_2008_SERVER,ONLY_WITH_SSL
